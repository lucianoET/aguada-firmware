              - generic [ref=e101]:
                - paragraph [ref=e102]: O custo por homem-hora por tipo de manutenção (CHPM) é uma métrica financeira usada para avaliar os custos totais de mão de obra associados à realização de diferentes tipos de atividades de manutenção em um determinado período de tempo. É calculado dividindo o custo de mão de obra (incluindo salários, benefícios, etc.) registrado por um tipo específico de manutenção pelo número total de horas trabalhadas nesse tipo de manutenção.
                - heading "O que é o CHPM?" [level=2] [ref=e103]
                - paragraph [ref=e104]:
                  - generic [ref=e105]:
                    - text: Segundo a
                    - link "SMRP (Society for Maintenance & Reliability Professionals)" [ref=e106] [cursor=pointer]:
                      - /url: https://smrp.org/
                    - text: ", os custos com mão de obra podem ultrapassar 40% do orçamento anual de manutenção."
                  - text: Este custo por hora pode variar dependendo de vários fatores, incluindo a complexidade do trabalho, o nível de habilidade e experiência necessários, as ferramentas e equipamentos necessários e a região ou país onde o trabalho é realizado. Diferentes tipos de manutenção (como
                  - link "manutenção preventiva" [ref=e107] [cursor=pointer]:
                    - /url: /pt-br/guias-manutencao/o-que-e-manutencao-preventiva
                  - text: ","
                  - link "corretiva" [ref=e108] [cursor=pointer]:
                    - /url: /pt-br/o-que-e-manutencao-corretiva
                  - text: ou preditiva) podem ter diferentes métricas de custo por hora devido às diferenças na natureza do trabalho envolvido.
                - paragraph [ref=e109]: No entanto, muitas empresas começaram a contar com equipe mais especializada para realizar tarefas específicas de manutenção, organizando os colaboradores de manutenção por área técnica com base em suas habilidades e conhecimentos técnicos, ou seja, em equipes especializadas em manutenção elétrica, mecânica, automação, instalações em geral, entre outras.
                - paragraph [ref=e110]: Esta abordagem permite que as empresas acompanhem mais detalhadamente os custos por hora de trabalho para cada atividade realizada, entendendo diretamente em qual área técnica estão investindo mais dinheiro.
                - heading [level=2] [ref=e111]:
                  - strong [ref=e113]: Posso continuar classificando os custos da minha organização por tipo de manutenção?
                - paragraph [ref=e114]: Sim. Na verdade, seguindo as orientações e benchmarking do modelo de manutenção de classe mundial, o valor da mão de obra para atividades corretivas (não planejadas) deve representar apenas 10% do total investido. No entanto, isso não fornece um resultado claro de onde especificamente os recursos estão sendo gastos.
                - paragraph [ref=e115]:
                  - img "1080x1080-janeiro-custo-hh-colaborador-ptbr-rrss" [ref=e117]
                - heading "Na prática, como é calculado o custo das horas de trabalho por tipo de manutenção?" [level=2] [ref=e118]
                - paragraph [ref=e120]: Para realizar este cálculo, a organização deve contar com um sistema de gestão de manutenção, ou algum outro método, que lhe permita registar detalhadamente informação sobre os membros da equipa de manutenção, como estão distribuídos segundo os seus conhecimentos técnicos e qual é o custo estimado da mão de obra de cada um.
                - paragraph [ref=e121]: "Além disso, é necessário um sistema eficiente para gerar ordens de trabalho, que permita registar informações como: o tipo de manutenção associado à atividade a realizar, o custo total da mão de obra correspondente aos responsáveis pela execução da tarefa e a duração da ordem de trabalho desde o início até ao seu fim."
                - paragraph [ref=e122]: "Com isso, podemos considerar que a empresa calcula os custos de homem-hora de acordo com cada área técnica:"
                - list [ref=e123]:
                  - listitem [ref=e124]:
                    - generic [ref=e125]:
                      - strong [ref=e126]: "Manutenção mecânica:"
                      - text: Envolve a manutenção de equipamentos e sistemas mecânicos, como motores, bombas, transportadores e outras partes móveis.
                  - listitem [ref=e127]:
                    - generic [ref=e128]:
                      - strong [ref=e129]: "Manutenção elétrica:"
                      - text: Inclui a manutenção e reparação de equipamentos e sistemas elétricos, como cabos, painéis de controle, disjuntores e outros componentes elétricos.
                  - listitem [ref=e130]:
                    - generic [ref=e131]:
                      - strong [ref=e132]: "Manutenção de instrumentação e controle:"
                      - text: Esta área implica em manter e solucionar problemas nos sistemas utilizados para medir e controlar processos industriais, como sensores, válvulas de controle e controladores lógicos programáveis (PLCs).
                  - listitem [ref=e133]:
                    - generic [ref=e134]:
                      - strong [ref=e135]: "Manutenção de HVAC:"
                      - text: Envolve a manutenção dos sistemas de aquecimento, ventilação e ar condicionado para garantir um ambiente controlado e confortável dentro das instalações industriais.
                  - listitem [ref=e136]:
                    - generic [ref=e137]:
                      - strong [ref=e138]: "Manutenção estrutural:"
                      - text: Envolve a manutenção e reparação da infraestrutura física de uma instalação industrial, como edifícios, telhados e outras estruturas.
                - paragraph [ref=e139]:
                  - generic [ref=e140]: "A fórmula básica é:"
                - blockquote [ref=e141]:
                  - paragraph [ref=e142]:
                    - generic [ref=e143]: Custo por homem-hora (CHPM) =
                  - paragraph [ref=e145]: Custo total de mão de obra / Total de horas trabalhadas
                - paragraph [ref=e146]: "Agora, podemos considerar que para o último trimestre o departamento de manutenção registrou um total de 930 horas de trabalhos distribuídas da seguinte forma:"
                - heading "Custo por homem-hora por manutenção mecânica (CHPMM)" [level=4] [ref=e147]
                - list [ref=e148]:
                  - listitem [ref=e149]: Total de horas trabalhadas = 500
                  - listitem [ref=e150]: Custo total de mão de obra = $25000
                  - listitem [ref=e151]: CHMM = $25000 / 500 horas = $50 por hora
                - heading "Custo por homem-hora por manutenção eléctrica (CHPME)" [level=4] [ref=e152]
                - list [ref=e153]:
                  - listitem [ref=e154]: Total de horas trabalhadas = 200
                  - listitem [ref=e155]: Custo total de mão de obra = $18000
                  - listitem [ref=e156]: CHMM = $18000 / 200 horas = $90 por hora
                - heading "Custo por homem-hora por manutenção de instrumentação e controle (CHMIC)" [level=4] [ref=e157]
                - list [ref=e158]:
                  - listitem [ref=e159]: Total de horas trabalhadas = 50
                  - listitem [ref=e160]: Custo total de mão de obra = $30000
                  - listitem [ref=e161]: CHMIC = $30000 / 50 horas = $600 por hora
                - heading "Custo por homem-hora por manutenção de HVAC (CHPMH)" [level=4] [ref=e162]
                - list [ref=e163]:
                  - listitem [ref=e164]: Total de horas trabalhadas = 80
                  - listitem [ref=e165]: Custo total de mão de obra = $1000
                  - listitem [ref=e166]: CHMH = $1000 / 80 horas = $12.5 por hora
                - heading "Custo por homem-hora por manutenção estrutural (CHPMES)" [level=4] [ref=e167]
                - list [ref=e168]:
                  - listitem [ref=e169]: Total de horas trabalhadas = 100
                  - listitem [ref=e170]: Custo total de mão de obra = $2000
                  - listitem [ref=e171]: CHMES = $2000 / 100 horas = $20 por hora
                - paragraph [ref=e172]:
                  - img "1080x1080-janeiro-chpm-ptbr-blog" [ref=e174]
                - paragraph [ref=e175]: "Analisando os resultados, podemos concluir que no último trimestre, o gasto total com mão de obra foi de $76000, dos quais:"
                - list [ref=e176]:
                  - listitem [ref=e177]: 39,5% foram destinados à manutenção no setor de controle;
                  - listitem [ref=e178]: 32,9% foram destinados à manutenção mecânica;
                  - listitem [ref=e179]: 23,7% foram destinados à manutenção elétrica;
                  - listitem [ref=e180]: 2,6% foram destinados à manutenção estrutural;
                  - listitem [ref=e181]: 1,3% foram destinados à manutenção AVAC-R.
                - paragraph [ref=e182]: Por outro lado, também podemos observar que 53,7% das horas totais de manutenção foram destinadas a ações de natureza mecânica. 21,5% foram destinados a tarefas elétricas. 10,8% foram destinados à manutenção estrutural, e 8,6% e 5,4% foram destinados à manutenção de AVAC-R e de controle, respectivamente.
                - paragraph [ref=e183]: Se compararmos em detalhes, podemos observar que o percentual de horas de manutenção na área de instrumentação e controle foi o menor de todos, porém, o gasto destinado a esta área foi o maior de todos. Isso se reflete no custo elevado de homem-hora, já que esses são serviços altamente especializados.
                - paragraph [ref=e184]: Neste caso, com base no custo de homem-hora, a empresa pode decidir se conta com profissionais dessa área em sua equipe ou, por outro lado, terceiriza esse serviço.
                - paragraph [ref=e185]: Em resumo, ao calcular o custo por hora para cada tipo de manutenção, as organizações podem obter uma melhor compreensão de seus gastos de manutenção e tomar decisões mais assertivas sobre a alocação de recursos, orçamentos e melhorias de eficiência.
                - paragraph [ref=e186]: Isso também pode ser útil para comparar o desempenho com os padrões da indústria ou com o desempenho passado da organização.
                - paragraph [ref=e187]
                - paragraph [ref=e188]
