[env:esp32-devkit]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

build_src_filter = +<*.cpp> +<*.h>
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DGPS_UART_NUM=2
    -DGPS_RX_PIN=16
    -DGPS_TX_PIN=17
    -DGPS_BAUD=9600
    -DLED_PIN=2
    -DDEFAULT_I2C_SDA_PIN=21
    -DDEFAULT_I2C_SCL_PIN=22
    ; Mesma regra do env C3: build em rede => simulador de bancada fora.
    ; Para voltar a usar o simulador, criar um env dedicado sem portal/
    ; telemetry em vez de reativar a flag aqui.
    -DGPS_BENCH_SIM=0
    -I../shared

lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    olikraus/U8g2 @ ^2.36.18
    dfrobot/DFRobot_QMC5883 @ ^1.0.0
    adafruit/Adafruit HTU21DF Library @ ^1.1.2
    knolleary/PubSubClient @ ^2.8

[env:esp32-c3-supermini]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

build_src_filter = +<*.cpp> +<*.h>
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DGPS_UART_NUM=1
    -DGPS_RX_PIN=20
    -DGPS_TX_PIN=21
    -DGPS_BAUD=9600
    -DLED_PIN=8
    -DLED_ACTIVE_LOW=0
    ; GPIO6/7 (convencao do repo, ver gps_config.h) travam o boot nesta placa:
    ; presos em LOW, o scan de i2c_bus::begin() bloqueia para sempre em 0x08 e
    ; setup() nunca alcanca o pipeline do GPS. Wire.setTimeOut() nao segura --
    ; o hang e abaixo da camada Wire. Bancada 2026-08-14: com 3/4 o boot passa
    ; e chega ao [HEALTH]. GPIO3/4 ficaram livres quando o TFT SPI saiu.
    -DDEFAULT_I2C_SDA_PIN=3
    -DDEFAULT_I2C_SCL_PIN=4
    ; Fase 3 (portal captive + MQTT/HAOS) e uma build em rede, entao o
    ; simulador de bancada TEM de sair -- gps_config.h e explicito: "must
    ; never ship enabled once the tracker talks to a network". Com ele em 1,
    ; posicoes sinteticas iriam parar ao mapa do Home Assistant.
    -DGPS_BENCH_SIM=0
    -I../shared

lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    olikraus/U8g2 @ ^2.36.18
    dfrobot/DFRobot_QMC5883 @ ^1.0.0
    adafruit/Adafruit HTU21DF Library @ ^1.1.2
    knolleary/PubSubClient @ ^2.8
