; Assistente de enlace ESP-NOW (levantamento de campo): ESP32 DevKit + OLED SSD1306 + 1 botão.
; Mede, no ponto onde está, RSSI e perda (buracos de seq) de cada node, e "pinga" node ou
; gateway por unicast de 1 byte (ACK de MAC). Não altera nada nos nodes nem no gateway.
;
; Ligações: OLED SDA=21 SCL=22 VCC=3V3 · botão GPIO0→GND (o BOOT da DevKit já serve).
; Botão: toque = próximo node · segurar 1 s = próxima tela (lista/detalhe/ping) · 3 s = zera.
; Serial 115200 em CSV (linhas RX,... e PING,...) para registrar o levantamento.
;
;   pio run -e esp32dev -t upload && pio device monitor
; NUNCA usar a porta do gateway de produção.
[platformio]
default_envs = esp32dev

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

[env:esp32dev]
build_src_filter = +<*> -<main_cyd.cpp>
build_flags =
    -I../shared
    -DESPNOW_CHANNEL=11
; MAC do gateway serial para o ping (campo "mac" de aguada/gateway/status). Sem ele, a
; linha GW aparece como "defina GW_MAC" e só os nodes podem ser pingados.
;   -DGW_MAC='{0x24,0xD7,0xEB,0x5B,0x2E,0x74}'
lib_deps =
    olikraus/U8g2 @ ^2.36.18

; Mesma ferramenta no CYD (ESP32-2432S028R, ILI9341 + toque XPT2046), portátil por powerbank.
; Telas por toque: LISTA · SINAL · PING · LOG. Bin serve também para o Launcher (esp32dev 4 MB).
;   pio run -e cyd -t upload --upload-port /dev/ttyUSB0
[env:cyd]
build_src_filter = +<*> -<main.cpp>
build_flags =
    -I../shared
    -DESPNOW_CHANNEL=11
    -DGW_MAC='{0x8C,0xD0,0xB2,0xA8,0xAB,0xD6}'
    ; TFT_eSPI configurado aqui (não depende do User_Setup.h global)
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=0
    -DTFT_INVERSION_ON=1
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
