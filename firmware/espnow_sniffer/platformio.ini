; Sniffer ESP-NOW (diagnóstico): modo promíscuo, percorre canais e imprime todo
; quadro ESP-NOW visto (canal, MAC, RSSI, tamanho, corpo em hex), qualquer formato.
; Uso: achar em que canal um node transmite ou se ele transmite de todo.
;   pio run -t upload --upload-port /dev/ttyACM0 && pio device monitor
; Canais e tempo por canal: CH[] e DWELL_MS em src/main.cpp (nodes enviam a cada ~60 s).
[env:c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
