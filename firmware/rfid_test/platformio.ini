# Teste básico RFID (ID-12) -> Captive Portal
# Sketch standalone, isolado do firmware do nó. Ver
# docs/superpowers/specs/2026-06-12-rfid-captive-test-design.md
[env:esp32-c3-supermini]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

# SuperMini conectado na USB (ESP32-C3 USB-JTAG)
upload_port  = /dev/ttyACM0
monitor_port = /dev/ttyACM0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Iinclude
