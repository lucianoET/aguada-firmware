# Core fixo (Arduino 3.3.11 / IDF 5.5). Gateway e node usam a API ESP-NOW do IDF5
# (esp_now_recv_info_t); "espressif32" sem versão quebra o build quando o core global muda.
[core]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip

[env:esp32-c3-supermini]
platform  = ${core.platform}
board     = esp32-c3-devkitm-1
framework = arduino

board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed  = 921600

# Only include .cpp files (excludes any leftover .ino)
build_src_filter = +<*.cpp> +<*.h>
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Iinclude
    -I../shared

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit AHTX0 @ ^2.0.5
    adafruit/Adafruit BusIO @ ^1.16.1
    adafruit/ENS160 - Adafruit Fork @ ^3.0.1
lib_extra_dirs = include

[env:esp32-c3-supermini-release]
extends   = env:esp32-c3-supermini
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Os

[env:esp32-c3-supermini-ch11]
extends      = env:esp32-c3-supermini
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DESPNOW_CHANNEL=11
    -Iinclude
    -I../shared

# CB3 node (Casa de Bombas 3 - CB31/CB32) - 0x2ec4, 2 sensors
[env:cb3-ch11]
extends      = env:esp32-c3-supermini-ch11
upload_port  = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_80:F1:B2:50:2E:C4-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_80:F1:B2:50:2E:C4-if00

# Dedicated profile for NODE-03 (CB31/CB32) connected on /dev/ttyACM2 (legacy)
[env:node3-cb3]
extends      = env:esp32-c3-supermini-release
upload_port  = /dev/ttyACM2
monitor_port = /dev/ttyACM2

# CON node (Castelo de Consumo) - 0x7758, 1 sensor
[env:con-ch11]
extends      = env:esp32-c3-supermini-ch11
upload_port  = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_20:6E:F1:6B:77:58-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_20:6E:F1:6B:77:58-if00

# Temporary slow upload for ACM1 (troubleshooting)
[env:slow-acm1]
extends      = env:esp32-c3-supermini-release
upload_port  = /dev/ttyACM1
monitor_port = /dev/ttyACM1
upload_speed = 115200

# ANI-01 — Aguada Node Indoor (ESP32-C3 SuperMini, ENS160+AHT21, WS2812B RGB)
# Flash neste env arranca directamente em modo AIR_QUALITY + relay mesh.
[env:ani-01-c3]
extends      = env:esp32-c3-supermini
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDEFAULT_NUM_SENSORS=1
    -DDEFAULT_SENSOR_TYPE=1
    -DDEFAULT_RELAY_ENABLED=1
    -Iinclude
    -I../shared

# ESP32 DevKit (classic ESP32) - useful for standalone relay nodes
[env:esp32-devkit-relay]
platform  = ${core.platform}
board     = esp32dev
framework = arduino

board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed  = 460800

# Only include .cpp files (excludes any leftover .ino)
build_src_filter = +<*.cpp> +<*.h>
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DDEFAULT_LED_PIN=2
    -DDEFAULT_NUM_SENSORS=0
    -Iinclude
    -I../shared

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit AHTX0 @ ^2.0.5
    adafruit/Adafruit BusIO @ ^1.16.1
    adafruit/ENS160 - Adafruit Fork @ ^3.0.1
lib_extra_dirs = include

# ESP32 DevKit (classic ESP32) - sensor node, 1 sensor
# Default pins: TRIG1=5, ECHO1=18
[env:esp32-devkit]
platform  = ${core.platform}
board     = esp32dev
framework = arduino

board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed  = 460800

build_src_filter = +<*.cpp> +<*.h>
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DDEFAULT_NUM_SENSORS=1
    -Iinclude
    -I../shared

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit AHTX0 @ ^2.0.5
    adafruit/Adafruit BusIO @ ^1.16.1
    adafruit/ENS160 - Adafruit Fork @ ^3.0.1
lib_extra_dirs = include

# ESP32 DevKit - sensor node, release (lower log verbosity)
[env:esp32-devkit-release]
extends   = env:esp32-devkit
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DDEFAULT_NUM_SENSORS=1
    -Os
    -Iinclude
    -I../shared

# CAV node (Castelo de Incêndio) - node_id=0xC9C4 (MAC 38:18:2B:8A:C9:C4), 1 sensor (TRIG=26, ECHO=25)
[env:cav-ch11]
extends   = env:esp32-devkit
upload_port  = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5A58054485-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5A58054485-if00
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DDEFAULT_NUM_SENSORS=1
    -DESPNOW_CHANNEL=11
    -DDEFAULT_TRIG1=26
    -DDEFAULT_ECHO1=25
    -Iinclude
    -I../shared

# ESP32 DevKit - sensor node, channel 11, 2 sensors (pins lado a lado)
# S1: TRIG=25 ECHO=26  |  S2: TRIG=32 ECHO=33
[env:esp32-devkit-ch11]
extends   = env:esp32-devkit
upload_port  = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5A7B067329-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5A7B067329-if00
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DDEFAULT_NUM_SENSORS=2
    -DESPNOW_CHANNEL=11
    -DDEFAULT_TRIG1=25
    -DDEFAULT_ECHO1=26
    -DDEFAULT_TRIG2=32
    -DDEFAULT_ECHO2=33
    -Iinclude
    -I../shared

