# Node Communicator — voz (PTT por UDP multicast), alto-falante/linha, OLED, alarme e sirene.
# Doc: COMMUNICATOR.md
# Credenciais WiFi fora do git: copie secrets.ini.example → secrets.ini (ignorado).

[platformio]
extra_configs = secrets.ini

[secrets]
wifi_ssid =
wifi_pass =

# Mesmo core fixo do node/gateway (Arduino 3.3.11 / IDF 5.5).
[core]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip

# communicator_c3 — ESP32-C3 SuperMini + INMP441 + MAX98357A (ou PCM5102A) + OLED + sirene.
# ESP-NOW no canal 11 (CMASM): o AP do WiFi tem de estar no mesmo canal.
[env:communicator_c3]
platform  = ${core.platform}
board     = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DESPNOW_CHANNEL=11
    -DWIFI_SSID='"${secrets.wifi_ssid}"'
    -DWIFI_PASS='"${secrets.wifi_pass}"'
    -Iinclude
    -I../shared
build_src_filter = +<*> -<yeti/>
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.12.1

# yeti_s3 — boneco Yeti: ESP32-S3 SuperMini + ST7789 1.3" 240×240 + INMP441 + MAX98357A +
# touch TTP223 + HTU21D/MPU6050/BH1750. Mesmo áudio/voz/alarme do communicator. Doc: YETI.md
[env:yeti_s3]
platform  = ${core.platform}
board     = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions  = default.csv
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DESPNOW_CHANNEL=11
    -DWIFI_SSID='"${secrets.wifi_ssid}"'
    -DWIFI_PASS='"${secrets.wifi_pass}"'
    -DCOMM_NAME='"YETI"'
    -DCOMM_PIN_I2S_BCLK=4
    -DCOMM_PIN_I2S_WS=5
    -DCOMM_PIN_I2S_DOUT=6
    -DCOMM_PIN_I2S_DIN=7
    -DCOMM_PIN_SIREN=-1
    -DCOMM_VOLUME_DEFAULT=50
    -Iinclude
    -I../shared
build_src_filter = +<*> -<main.cpp>
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.7
