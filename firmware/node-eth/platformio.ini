; Aguada — node-eth: wired Ethernet reservoir node (Arduino Nano + ENC28J60 + HC-SR04)
; Node 0xEE02 (CAV, Castelo de Incêndio). Publishes protocol-shaped sensor JSON
; directly to MQTT on "aguada/raw/0xEE02/1" — bridge.py routes it through the
; existing _handle_sensor pipeline (reservoir math, HA Discovery, tracker).
;
; Per D-01: keep PlatformIO's default -Os (no -O flag override). It is what
; makes this fit the ATmega328's 30720-byte flash; a legacy -O2 build reached
; 92% flash usage.
;
; UIP_CONNECT_TIMEOUT: UIPEthernet's UIPClient::connect() blocks FOREVER by
; default (-1) when the peer is unreachable — the 8s watchdog then resets the
; board before the graceful MQTT retry/escalation path ever runs (boot loop
; observed on bench, 2026-08-03). 5s < 8s WDT lets connect() fail cleanly.

[env:node-cav-eth]
platform      = atmelavr
board         = nanoatmega328
framework     = arduino
upload_speed  = 115200   ; this Nano has the new optiboot bootloader (57600 fails sync)
monitor_speed = 9600
build_flags   = -D UIP_CONNECT_TIMEOUT=5

lib_deps =
    uipethernet/UIPEthernet@^2.0.12
    knolleary/PubSubClient@^2.8
