# Core fixo (Arduino 3.3.11 / IDF 5.5). Gateway e node usam a API ESP-NOW do IDF5
# (esp_now_recv_info_t); "espressif32" sem versão quebra o build quando o core global muda.
[core]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip

# Credenciais WiFi fora do git: copie secrets.ini.example → secrets.ini (ignorado).
# Sem secrets.ini os envs WiFi compilam com SSID vazio e o gateway só loga o erro.
[platformio]
extra_configs = secrets.ini

[secrets]
wifi_ssid     =
wifi_pass     =
web_wifi_ssid =
web_wifi_pass =
mqtt_host     =
mqtt_user     =
mqtt_pass     =

# ── Gateway C3 SuperMini (padrão, mais disponível) ───────────────────────────
[env:gateway-c3]
platform  = ${core.platform}
board     = esp32-c3-devkitm-1
framework = arduino

board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed  = 921600

build_src_filter = +<*.cpp> +<*.h>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I../shared

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

# C3 com USB nativo: serial sem chip conversor (evita o caminho UART→CH343)
[env:gateway-c3-ch11]
extends = env:gateway-c3
build_flags =
    ${env:gateway-c3.build_flags}
    -DESPNOW_CHANNEL=11

# USB principal + espelho WiFi/MQTT em aguada/gateway/rx (reserva se o USB cair).
# O roteador precisa estar fixo no mesmo canal dos nodes (ESPNOW_CHANNEL).
[env:gateway-c3-usb-wifi-ch11]
extends = env:gateway-c3
build_flags =
    ${env:gateway-c3.build_flags}
    -DESPNOW_CHANNEL=11
    -DGATEWAY_WIFI_MIRROR
    -DGATEWAY_STATUS_INTERVAL_MS=60000
    -DWIFI_SSID='"${secrets.wifi_ssid}"'
    -DWIFI_PASS='"${secrets.wifi_pass}"'
    -DMQTT_BROKER='"${secrets.mqtt_host}"'
    -DMQTT_PORT=1883
    -DMQTT_USER='"${secrets.mqtt_user}"'
    -DMQTT_PASS='"${secrets.mqtt_pass}"'
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8

[env:gateway-c3-release]
extends   = env:gateway-c3
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Os

[env:gateway-c3-v2]
extends = env:gateway-c3
build_flags =
    ${env:gateway-c3.build_flags}
    -DGATEWAY_VERSION_SUFFIX='"-usbv2"'
    -DGATEWAY_READY_REPEAT_COUNT=5
    -DGATEWAY_READY_REPEAT_INTERVAL_MS=1000
    -DGATEWAY_STATUS_INTERVAL_MS=30000
    -DGATEWAY_JSON_FLUSH=0

[env:gateway-c3-v2-safe]
extends = env:gateway-c3-v2
upload_speed = 115200

# ── Gateway S3 (reservado para produção / OTA) ────────────────────────────────
[env:gateway-s3]
platform  = ${core.platform}
board     = esp32-s3-devkitc-1
framework = arduino

board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed  = 921600

build_src_filter = +<*.cpp> +<*.h>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I../shared

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

[env:gateway-s3-v2]
extends = env:gateway-s3
build_flags =
    ${env:gateway-s3.build_flags}
    -DGATEWAY_VERSION_SUFFIX='"-usbv2"'
    -DGATEWAY_READY_REPEAT_COUNT=5
    -DGATEWAY_READY_REPEAT_INTERVAL_MS=1000
    -DGATEWAY_STATUS_INTERVAL_MS=30000
    -DGATEWAY_JSON_FLUSH=0

# ── Gateway ESP32 clássico (USB-serial CH340/CP210x) ────────────────────────
[env:gateway-esp32-usb]
platform  = ${core.platform}
board     = esp32dev
framework = arduino

board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed  = 460800

build_src_filter = +<*.cpp> +<*.h>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -I../shared

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

[env:gateway-esp32-usb-ch11]
extends = env:gateway-esp32-usb
build_flags =
    ${env:gateway-esp32-usb.build_flags}
    -DESPNOW_CHANNEL=11

[env:gateway-esp32-safe]
extends   = env:gateway-esp32-usb
upload_speed = 115200
upload_flags = --no-stub

# ── Gateway ESP32 DevKit — WiFi + MQTT (sem serial bridge) ────────────────────
# Recebe ESP-NOW e publica MQTT diretamente via WiFi.
# Para flashar: pio run -e gateway-esp32-wifi -t upload
[env:gateway-esp32-wifi]
platform  = ${core.platform}
board     = esp32dev
framework = arduino

board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed  = 460800

# Inclui main_wifi.cpp e exclui main.cpp (USB-serial)
build_src_filter = -<main.cpp> +<main_wifi.cpp> +<espnow_gw.cpp> +<crc16.h>

upload_port   = /dev/ttyACM0
monitor_port  = /dev/ttyACM0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DGATEWAY_WIFI_BUILD
    -DWIFI_SSID='"${secrets.wifi_ssid}"'
    -DWIFI_PASS='"${secrets.wifi_pass}"'
    -DMQTT_BROKER='"192.168.0.186"'
    -DMQTT_PORT=1883
    -DMQTT_USER='""'
    -DMQTT_PASS='""'
    -I../shared

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8

# ── Gateway ESP32 DevKit — Dual (WiFi + MQTT  E  Serial JSON) ────────────────
# Mesmo que gateway-esp32-wifi, mas também emite JSON via Serial USB.
# A bridge serial detecta o dispositivo e lê do Serial; ao desconectar, cai
# automaticamente no fallback MQTT (GATEWAY_TRANSPORT=auto no .env).
# Para flashar: pio run -e gateway-esp32-dual -t upload
[env:gateway-esp32-dual]
extends = env:gateway-esp32-wifi
build_flags =
    ${env:gateway-esp32-wifi.build_flags}
    -DGATEWAY_DUAL_OUTPUT=1
    -DGATEWAY_STATUS_INTERVAL_MS=60000

[env:gateway-esp32-dual-safe]
extends = env:gateway-esp32-dual
upload_speed = 57600
upload_flags = --no-stub

# ── Gateway ESP32 DevKit — Aguada Web (Docker/MQTT) ─────────────────────────
# Use este perfil para publicar em um broker MQTT alcançável pelo backend Docker.
# IMPORTANTE: MQTT_BROKER deve ser o IP/LAN do host que publica a porta 1883,
# não o nome do container/service Docker.
[env:gateway-esp32-aguada-web]
platform  = ${core.platform}
board     = esp32dev
framework = arduino

board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed  = 460800

build_src_filter = -<main.cpp> +<main_wifi.cpp> +<espnow_gw.cpp> +<crc16.h>
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DGATEWAY_WIFI_BUILD
    -DGATEWAY_DUAL_OUTPUT=1
    -DGATEWAY_STATUS_INTERVAL_MS=60000
    -DESPNOW_CHANNEL=11
    -DWIFI_SSID='"${secrets.web_wifi_ssid}"'
    -DWIFI_PASS='"${secrets.web_wifi_pass}"'
    -DMQTT_BROKER='"192.168.0.186"'
    -DMQTT_PORT=1883
    -DMQTT_USER='""'
    -DMQTT_PASS='""'
    -I../shared

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8

[env:gateway-esp32-aguada-web-safe]
extends = env:gateway-esp32-aguada-web
upload_speed = 57600
upload_flags = --no-stub
