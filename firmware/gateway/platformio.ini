# ── Gateway ESP32 clássico (USB-serial CH340/CP210x) ────────────────────────
[env:gateway-esp32-usb]
platform  = espressif32
board     = esp32dev
framework = arduino

board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed  = 460800

build_src_filter = +<*.cpp> +<*.h>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -I../shared

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

[env:gateway-esp32-safe]
extends   = env:gateway-esp32-usb
upload_speed = 115200
upload_flags = --no-stub

# ── Gateway ESP32 DevKit — WiFi + MQTT (sem serial bridge) ────────────────────
# Recebe ESP-NOW e publica MQTT diretamente via WiFi.
# Para flashar: pio run -e gateway-esp32-wifi -t upload
[env:gateway-esp32-wifi]
platform  = espressif32
board     = esp32dev
framework = arduino

board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed  = 460800

# Inclui main_wifi.cpp e exclui main.cpp (USB-serial)
build_src_filter = -<main.cpp> +<main_wifi.cpp> +<espnow_gw.cpp> +<crc16.h>

upload_port   = /dev/ttyACM0
monitor_port  = /dev/ttyACM0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DGATEWAY_WIFI_BUILD
    -DWIFI_SSID='"aguadaap"'
    -DWIFI_PASS='"aguada2026"'
    -DMQTT_BROKER='"192.168.0.186"'
    -DMQTT_PORT=1883
    -DMQTT_USER='""'
    -DMQTT_PASS='""'
    -I../shared

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8

# ── Gateway ESP32 DevKit — Dual (WiFi + MQTT  E  Serial JSON) ────────────────
# Mesmo que gateway-esp32-wifi, mas também emite JSON via Serial USB.
# A bridge serial detecta o dispositivo e lê do Serial; ao desconectar, cai
# automaticamente no fallback MQTT (GATEWAY_TRANSPORT=auto no .env).
# Para flashar: pio run -e gateway-esp32-dual -t upload
[env:gateway-esp32-dual]
extends = env:gateway-esp32-wifi
build_flags =
    ${env:gateway-esp32-wifi.build_flags}
    -DGATEWAY_DUAL_OUTPUT=1
    -DGATEWAY_STATUS_INTERVAL_MS=60000

[env:gateway-esp32-dual-safe]
extends = env:gateway-esp32-dual
upload_speed = 57600
upload_flags = --no-stub

# ── Gateway ESP32 DevKit — Aguada Web (Docker/MQTT) ─────────────────────────
# Use este perfil para publicar em um broker MQTT alcançável pelo backend Docker.
# IMPORTANTE: MQTT_BROKER deve ser o IP/LAN do host que publica a porta 1883,
# não o nome do container/service Docker.
[env:gateway-esp32-aguada-web]
platform  = espressif32
board     = esp32dev
framework = arduino

board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed  = 460800

build_src_filter = -<main.cpp> +<main_wifi.cpp> +<espnow_gw.cpp> +<crc16.h>
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DGATEWAY_WIFI_BUILD
    -DGATEWAY_DUAL_OUTPUT=1
    -DGATEWAY_STATUS_INTERVAL_MS=60000
    -DESPNOW_CHANNEL=11
    -DWIFI_SSID='"luciano"'
    -DWIFI_PASS='"Luciano19852012"'
    -DMQTT_BROKER='"192.168.0.186"'
    -DMQTT_PORT=1883
    -DMQTT_USER='""'
    -DMQTT_PASS='""'
    -I../shared

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8

[env:gateway-esp32-aguada-web-safe]
extends = env:gateway-esp32-aguada-web
upload_speed = 57600
upload_flags = --no-stub
